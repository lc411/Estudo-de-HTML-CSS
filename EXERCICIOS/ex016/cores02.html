<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        *{ /*configurações globais em css */
            height: 100%;
        }
        body {
            background-image: linear-gradient(to bottom, #4F0408 25%, #F2E527, #FCFCFC, #0583F2);
            background-attachment: fixed;
        }
        h1{
            color: aliceblue;
        }
    </style>
</head>
<body>
    <h1>Testando gradiente</h1>
</body>
</html>
